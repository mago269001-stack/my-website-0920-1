<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植數密碼 Botanumeric｜專屬天賦香氛調配</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="images/gemini-svg (4).svg">
  <style>
    /* 平滑滾動設定 */
    html {
      scroll-behavior: smooth;
    }

    /* 品牌特色卡片可點擊樣式 */
    .feature-card {
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .feature-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .feature-card::after {
      content: "點擊查看詳情 ➔";
      display: block;
      padding: 0 1.25rem 1rem;
      font-size: 0.85rem;
      color: #27AE60;
      font-weight: bold;
    }

    /* 彈窗 (Modal) 樣式 */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .modal-box {
      background-color: #ffffff;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .modal-backdrop.show .modal-box {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: #888;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #333;
    }

    .modal-title {
      font-size: 1.4rem;
      color: #2C3E50;
      margin-bottom: 1rem;
      border-bottom: 2px solid #27AE60;
      padding-bottom: 0.5rem;
      display: inline-block;
    }

    .modal-body {
      font-size: 0.98rem;
      line-height: 1.7;
      color: #4A5568;
    }

    .modal-body ul {
      padding-left: 1.2rem;
      margin: 0.8rem 0;
    }

    .modal-body li {
      margin-bottom: 0.4rem;
    }
  </style>
</head>
<body>

  <!-- 頁頭與導覽列 -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">植數密碼 Botanumeric</a>
      <nav>
        <button class="mobile-nav-toggle" aria-label="開啟選單" aria-expanded="false" id="menu-toggle">
          <span class="hamburger"></span>
        </button>
        <ul class="nav-links" id="nav-menu">
          <!-- 由 JS 自動動態渲染導覽選單 -->
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="hero-kicker" id="hero-kicker"></p>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-subtitle" id="hero-subtitle"></p>
  
      </div>
    </section>

    <!-- 品牌特色三大 Card 區塊 -->
    <section class="container">
      <h2 class="section-title" id="features-title"></h2>
      <div class="features-grid" id="features-container"></div>
    </section>


    <!-- 常見問題 FAQ 區塊 -->
    <section class="faq-section" id="faq">
      <div class="container">
        <h2 class="section-title" id="faq-title"></h2>
        <div class="faq-list" id="faq-container"></div>
      </div>
    </section>

    <section class="container contact-section">
      <div class="contact-box">
        <h2 class="contact-title" id="contact-title"></h2>
        <p class="contact-description" id="contact-description"></p>
        <a href="mailto:service@botanumeric.com" class="btn-primary">發送 Email 諮詢</a>
      </div>
    </section>
  </main>

  <!-- 服務說明彈窗 (Modal Box) -->
  <div class="modal-backdrop" id="service-modal">
    <div class="modal-box">
      <button type="button" class="modal-close" id="modal-close-btn">&times;</button>
      <h3 class="modal-title" id="modal-title">服務說明</h3>
      <div class="modal-body" id="modal-body">
        <!-- JavaScript 動態注入內容 -->
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p id="footer-text"></p>
    </div>
  </footer>

  <!-- 統一由 main.js 讀取 JSON 並渲染全站 DOM 數據與綁定互動功能 -->
  <script src="js/main.js"></script>
</body>
</html>
